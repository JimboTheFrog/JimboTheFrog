# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "npm"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "Node - "
    directory: "/src"
    schedule:
      interval: "monthly"
    labels:
      - ":label: Dependencies"
      - ":technologist:TypeScript/JavaScript :green_circle:"
    ignore:
      # opentype.js 1.3.5 and 2.0.0 both emit literal "NaN" inside the path
      # data returned by Path.toPathData() for Pwhalloween.ttf ("EVERY DAY")
      # and Irishclovers.otf ("Ready."), breaking the holiday README templates.
      # Pinned to 1.3.4 — drop this block once upstream ships a fix.
      - dependency-name: "opentype.js"
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "Github Actions - "
    directory: ./.github/workflows/
    schedule:
      interval: "monthly"
    labels:
      - ":label: Dependencies"
      - ":technologist: Github Actions :brown_circle:"
