Happy Halloween Style:
  defs:
    defs:
    addDef: |
      <filter
        id="dropshadow"
        x="0%" y="0%"
        width="100%" height="100%">
          <feDropShadow dx="3" dy="3" stdDeviation="1" flood-opacity="0.7"/>
      </filter>
  style: |
    .happy-Halloween {
      transform-origin: 1125px 300px;
      stroke: orange;
      stroke-width: 1px;
      animation: happy-Halloween-animation ease-in-out 1s infinite alternate;
    }
    @keyframes happy-Halloween-animation {
      0% {
        transform: rotate(5deg);
      }
      100% {
        transform: rotate(-5deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .happy-Halloween {
        animation: none !important;
      }
    }

Already:
  path:
    fill: 'darkorange'
    path:
      {{await (path_from "EVERY DAY" "Pwhalloween.ttf" 180 0 0)}}
    width: 650
    height: 180
    x: 800
    y: 100
    addClass: happy-Halloween
    attr: [ "filter", "url(#dropshadow)"]

JustGreen:
  path:
    fill: 'darkorange'
    path:
      {{await (path_from "IS SPOOKY." "Pwhalloween.ttf" 180 0 0)}}
    width: 700
    height: 180
    x: 775
