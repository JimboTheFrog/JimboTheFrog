Hello World Style:
  defs:
    defs:
    addDef: |
      <filter
        id="dropshadow"
        x="0%" y="0%"
        width="100%" height="100%">
          <feDropShadow dx="3" dy="3" stdDeviation="1" flood-opacity="0.7"/>
      </filter>
  style: |
    .hello-world {
      transform-origin: 1125px 300px;
      stroke: white;
      stroke-width: 1px;
      animation: hello-world-animation ease-in-out 1s infinite alternate;
    }
    @keyframes hello-world-animation {
      0% {
        transform: rotate(5deg);
      }
      100% {
        transform: rotate(-5deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .hello-world {
        animation: none !important;
      }
    }

Im Jimbo:
  path:
    path:
      {{await (path_from "I'm Jimbo." "RockSalt.ttf" 180 0 0)}}
    width: 680
    height: 180
    x: 790
    y: 100
    fill: '{{text}}'
    addClass: hello-world
    attr: [ "filter", "url(#dropshadow)"]

