Happy Valentines Style:
  defs:
    defs:
    addDef: |
      <filter
        id="dropshadow"
        x="0%" y="0%"
        width="100%" height="100%">
          <feDropShadow dx="3" dy="3" stdDeviation="1" flood-opacity="0.7"/>
      </filter>
  style: |
    .happy-valentines {
      transform-origin: 1125px 300px;
      stroke: pink;
      stroke-width: 1px;
      animation: happy-valentines-animation ease-in-out 1s infinite alternate;
    }
    @keyframes happy-valentines-animation {
      0% { transform: rotate(5deg); }
      100% { transform: rotate(-5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .happy-valentines { animation: none !important; }
    }

BeMy:
  path:
    fill: 'DeepPink'
    path:
      {{await (path_from "Be My" "HeartsWithEverything.ttf" 180 0 0)}}
    width: 400
    height: 180
    x: 930
    y: 100
    addClass: happy-valentines
    attr: [ "filter", "url(#dropshadow)"]

Debug:
  path:
    fill: 'DeepPink'
    path:
      {{await (path_from "Debug?" "HeartsWithEverything.ttf" 180 0 0)}}
    width: 500
    height: 180
    x: 880
    y: 295
    addClass: happy-valentines
    attr: [ "filter", "url(#dropshadow)"]
