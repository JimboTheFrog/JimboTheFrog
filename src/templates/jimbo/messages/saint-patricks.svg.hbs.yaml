Happy St Patricks Style:
  defs:
    defs:
    addDef: |
      <filter
        id="dropshadow"
        x="0%" y="0%"
        width="100%" height="100%">
          <feDropShadow dx="3" dy="3" stdDeviation="1" flood-opacity="0.7"/>
      </filter>
  style: |
    .happy-st-patricks {
      transform-origin: 1125px 300px;
      stroke: lightgreen;
      stroke-width: 1px;
      animation: happy-st-patricks-animation ease-in-out 1s infinite alternate;
    }
    @keyframes happy-st-patricks-animation {
      0% {
        transform: rotate(3deg);
      }
      100% {
        transform: rotate(-3deg);
      }
    }
    @media (prefers-reduced-motion) {
      .happy-st-patricks {
        animation: none !important;
      }
    }

WasBorn:
  path:
    fill: 'forestgreen'
    path:
      {{await (path_from "Was Born" "Irishclovers.otf" 180 0 0)}}
    width: 580
    height: 180
    x: 840
    y: 100
    addClass: happy-st-patricks
    attr: [ "filter", "url(#dropshadow)"]

Green:
  path:
    fill: 'forestgreen'
    path:
      {{await (path_from "Ready." "Irishclovers.otf" 180 0 0)}}
    width: 480
    height: 180
    x: 890
    y: 295
    addClass: happy-st-patricks
    attr: [ "filter", "url(#dropshadow)"]
