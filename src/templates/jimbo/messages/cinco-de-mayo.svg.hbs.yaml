Cinco De Mayo Style:
  defs:
    defs:
    addDef: |
      <filter
        id="dropshadow"
        x="0%" y="0%"
        width="100%" height="100%">
          <feDropShadow dx="3" dy="3" stdDeviation="1" flood-opacity="0.7"/>
      </filter>
  style: |
    .cinco-de-mayo {
      transform-origin: 1125px 300px;
      stroke: darkgreen;
      stroke-width: 1px;
      animation: cinco-de-mayo-animation ease-in-out 1s infinite alternate;
    }
    @keyframes cinco-de-mayo-animation {
      0% { transform: rotate(3deg); }
      100% { transform: rotate(-3deg); }
    }
    @media (prefers-reduced-motion) {
      .cinco-de-mayo { animation: none !important; }
    }

Viva:
  path:
    fill: 'red'
    path:
      {{await (path_from "Viva" "Sdfestivaldemo.ttf" 180 0 0)}}
    width: 380
    height: 180
    x: 940
    y: 100
    addClass: cinco-de-mayo
    attr: [ "filter", "url(#dropshadow)"]

LosFrogs:
  path:
    fill: 'green'
    path:
      {{await (path_from "Los Frogs!" "Sdfestivaldemo.ttf" 180 0 0)}}
    width: 700
    height: 180
    x: 775
    y: 295
    addClass: cinco-de-mayo
    attr: [ "filter", "url(#dropshadow)"]
